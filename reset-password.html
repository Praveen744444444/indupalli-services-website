<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password – Indupalli Services</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
:root{
  --primary:#2563eb; --primary-dark:#1d4ed8; --navy:#0f172a;
  --green:#10b981; --red:#ef4444; --orange:#f59e0b;
  --bg-light:#f8fafc; --border-color:#e2e8f0; --text-muted:#64748b;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-light);padding:20px;}
.card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:40px 32px;text-align:center;box-shadow:0 25px 50px -12px rgba(15,23,42,0.15);}
.icon-wrap{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px;background:#eff6ff;color:var(--primary);}
.icon-wrap.success{background:#ecfdf5;color:var(--green);}
.icon-wrap.error{background:#fef2f2;color:var(--red);}
.icon-wrap.warning{background:#fffbeb;color:var(--orange);}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
h2{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:8px;}
p{font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:22px;}

.input-group{display:flex;flex-direction:column;margin-bottom:15px;text-align:left;}
.input-group label{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.input-wrap{position:relative;}
.input-wrap i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;pointer-events:none;}
.input-wrap input{width:100%;padding:12px 16px 12px 44px;border:1.5px solid var(--border-color);border-radius:12px;font-size:14px;background:var(--bg-light);transition:all 0.2s ease;font-family:inherit;color:var(--navy);outline:none;}
.input-wrap input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,0.1);}
.field-error{font-size:12px;color:var(--red);margin-top:6px;text-align:left;min-height:16px;}

a.btn, button.btn{display:none;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;text-decoration:none;padding:12px 24px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;width:100%;margin-top:6px;font-family:inherit;}
button.btn:disabled{opacity:0.7;cursor:not-allowed;}
</style>
</head>
<body>

<div class="card">
  <div class="icon-wrap" id="iconWrap"><i class="fa-solid fa-spinner spin"></i></div>
  <h2 id="statusTitle">Checking your link...</h2>
  <p id="statusText">Please wait a moment while we confirm your password reset link.</p>

  <form id="resetForm" style="display:none;" novalidate>
    <div class="input-group">
      <label>New Password</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="newPassword" placeholder="Minimum 6 characters" autocomplete="new-password" required>
      </div>
    </div>
    <div class="input-group">
      <label>Confirm New Password</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password" required>
      </div>
    </div>
    <div class="field-error" id="fieldError"></div>
    <button class="btn" id="submitBtn" type="submit" style="display:block;">Set New Password</button>
  </form>

  <a class="btn" id="loginLink" href="login.html">Go to Login</a>
</div>

<script type="module">
import { auth } from "./firebase.js";
import { verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const iconWrap = document.getElementById("iconWrap");
const statusTitle = document.getElementById("statusTitle");
const statusText = document.getElementById("statusText");
const loginLink = document.getElementById("loginLink");
const resetForm = document.getElementById("resetForm");
const submitBtn = document.getElementById("submitBtn");
const fieldError = document.getElementById("fieldError");

function render(state, title, text, { showForm = false, showLogin = false } = {}) {
  iconWrap.classList.remove("success", "error", "warning");
  if (state === "success") { iconWrap.classList.add("success"); iconWrap.innerHTML = '<i class="fa-solid fa-circle-check"></i>'; }
  else if (state === "warning") { iconWrap.classList.add("warning"); iconWrap.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>'; }
  else if (state === "error") { iconWrap.classList.add("error"); iconWrap.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>'; }
  else { iconWrap.innerHTML = '<i class="fa-solid fa-key"></i>'; }
  statusTitle.textContent = title;
  statusText.textContent = text;
  resetForm.style.display = showForm ? "block" : "none";
  loginLink.style.display = showLogin ? "inline-block" : "none";
}

let pendingOobCode = null;

// STEP 1 — read-only validation, safe to run automatically on page load.
// verifyPasswordResetCode() only inspects the code; it does NOT consume it,
// so an email-security scanner or link-preview bot silently opening this
// URL before the real user clicks cannot burn the one-time code here.
window.addEventListener("DOMContentLoaded", async () => {
  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode");
  const oobCode = params.get("oobCode");

  if (mode !== "resetPassword" || !oobCode) {
    render("error", "Invalid Reset Link", "This link is missing required information. Please request a new password reset link from the login page.", { showLogin: true });
    return;
  }

  try {
    const email = await verifyPasswordResetCode(auth, oobCode);
    pendingOobCode = oobCode;
    statusText.textContent = "";
    render("info", "Reset Your Password", email ? `Enter a new password for ${email}.` : "Enter a new password for your account.", { showForm: true });
  } catch (err) {
    if (err && err.code === "auth/expired-action-code") {
      render("warning", "Link Expired", "This password reset link has expired. Please request a new one from the login page.", { showLogin: true });
    } else if (err && err.code === "auth/invalid-action-code") {
      render("warning", "Link Already Used", "This password reset link has already been used, or is invalid. Please request a new one from the login page.", { showLogin: true });
    } else {
      render("error", "Something Went Wrong", (err && err.message) || "We couldn't validate this reset link. Please try again or request a new one.", { showLogin: true });
    }
  }
});

// STEP 2 — the actual consuming call. Gated behind the person actually
// typing and submitting a new password, which a scanner/prefetcher cannot
// do, so the code only gets used when the person genuinely intends to
// reset their password.
resetForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  fieldError.textContent = "";

  if (!pendingOobCode) return;

  const pw = document.getElementById("newPassword").value;
  const confirmPw = document.getElementById("confirmPassword").value;

  if (pw.length < 6) {
    fieldError.textContent = "Password must be at least 6 characters.";
    return;
  }
  if (pw !== confirmPw) {
    fieldError.textContent = "Passwords do not match.";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> Updating...';

  try {
    await confirmPasswordReset(auth, pendingOobCode, pw);
    render("success", "Password Updated!", "Your password has been reset successfully. You can now log in with your new password.", { showLogin: true });
    setTimeout(() => { window.location.href = "login.html"; }, 1800);
  } catch (err) {
    submitBtn.disabled = false;
    submitBtn.innerHTML = "Set New Password";
    if (err && err.code === "auth/expired-action-code") {
      render("warning", "Link Expired", "This password reset link has expired. Please request a new one from the login page.", { showLogin: true });
    } else if (err && err.code === "auth/invalid-action-code") {
      render("warning", "Link Already Used", "This password reset link has already been used. Please request a new one from the login page.", { showLogin: true });
    } else if (err && err.code === "auth/weak-password") {
      fieldError.textContent = "Please choose a stronger password (minimum 6 characters).";
      submitBtn.disabled = false;
    } else {
      fieldError.textContent = (err && err.message) || "Could not update your password. Please try again.";
    }
  }
});
</script>
</body>
</html>
