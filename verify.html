<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email – Indupalli Services</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
:root{
  --primary:#2563eb; --primary-dark:#1d4ed8; --navy:#0f172a;
  --green:#10b981; --red:#ef4444; --orange:#f59e0b;
  --bg-light:#f8fafc; --border-color:#e2e8f0; --text-muted:#64748b;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-light);padding:20px;}
.card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:40px 32px;text-align:center;box-shadow:0 25px 50px -12px rgba(15,23,42,0.15);}
.icon-wrap{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px;background:#eff6ff;color:var(--primary);}
.icon-wrap.success{background:#ecfdf5;color:var(--green);}
.icon-wrap.error{background:#fef2f2;color:var(--red);}
.icon-wrap.warning{background:#fffbeb;color:var(--orange);}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
h2{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:8px;}
p{font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:22px;}
a.btn{display:none;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;text-decoration:none;padding:12px 24px;border-radius:12px;font-size:14.5px;font-weight:700;}
button.btn{display:none;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;text-decoration:none;padding:12px 24px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;width:100%;margin-bottom:10px;font-family:inherit;}
button.btn:disabled{opacity:0.7;cursor:not-allowed;}
button.btn .spin{margin-right:6px;}
</style>
</head>
<body>

<div class="card">
  <div class="icon-wrap" id="iconWrap"><i class="fa-solid fa-spinner spin"></i></div>
  <h2 id="statusTitle">Checking your link...</h2>
  <p id="statusText">Please wait a moment while we confirm your verification link.</p>
  <button class="btn" id="confirmBtn" type="button" style="display:none;">Confirm Email Verification</button>
  <a class="btn" id="loginLink" href="login.html">Go to Login</a>
</div>

<script type="module">
import { auth } from "./firebase.js";
import { supabase } from "./supabase.js";
import { applyActionCode, checkActionCode } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const iconWrap = document.getElementById("iconWrap");
const statusTitle = document.getElementById("statusTitle");
const statusText = document.getElementById("statusText");
const loginLink = document.getElementById("loginLink");
const confirmBtn = document.getElementById("confirmBtn");

function render(state, title, text, { showConfirm = false, showLogin = false } = {}) {
  iconWrap.classList.remove("success", "error", "warning");
  if (state === "success") { iconWrap.classList.add("success"); iconWrap.innerHTML = '<i class="fa-solid fa-circle-check"></i>'; }
  else if (state === "warning") { iconWrap.classList.add("warning"); iconWrap.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>'; }
  else if (state === "error") { iconWrap.classList.add("error"); iconWrap.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>'; }
  else { iconWrap.innerHTML = '<i class="fa-solid fa-envelope-circle-check"></i>'; }
  statusTitle.textContent = title;
  statusText.textContent = text;
  confirmBtn.style.display = showConfirm ? "inline-block" : "none";
  loginLink.style.display = showLogin ? "inline-block" : "none";
}

let pendingOobCode = null;
let pendingEmail = null;

// STEP 1 — read-only validation, safe to run automatically on page load.
// checkActionCode() only inspects the code; it does NOT consume it, so an
// email-security scanner or link-preview bot silently opening this URL
// before the real user clicks cannot burn the one-time code here.
window.addEventListener("DOMContentLoaded", async () => {
  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode");
  const oobCode = params.get("oobCode");

  if (mode !== "verifyEmail" || !oobCode) {
    render("error", "Invalid Verification Link", "This link is missing required information. Please request a new verification email from the login page.", { showLogin: true });
    return;
  }

  try {
    const info = await checkActionCode(auth, oobCode);
    pendingOobCode = oobCode;
    pendingEmail = info?.data?.email || null;

    render(
      "info",
      "Confirm Your Email",
      pendingEmail
        ? `Click below to verify ${pendingEmail} and activate your account.`
        : "Click below to verify your email and activate your account.",
      { showConfirm: true }
    );
  } catch (err) {
    if (err && err.code === "auth/expired-action-code") {
      render("warning", "Link Expired", "This verification link has expired. Please request a new verification email from the login page.", { showLogin: true });
    } else if (err && err.code === "auth/invalid-action-code") {
      render("warning", "Already Verified", "This verification link has already been used. If you've already verified your email, you can log in now.", { showLogin: true });
    } else {
      render("error", "Verification Failed", (err && err.message) || "Something went wrong while checking your verification link. Please try again or request a new link.", { showLogin: true });
    }
  }
});

// STEP 2 — the actual consuming call. Gated behind a real click, which a
// scanner/prefetcher cannot perform, so the code only gets used when the
// person genuinely intends to verify.
confirmBtn.addEventListener("click", async () => {
  if (!pendingOobCode) return;

  confirmBtn.disabled = true;
  confirmBtn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> Verifying...';

  try {
    await applyActionCode(auth, pendingOobCode);

    // Firebase is now the source of truth (isEmailVerified = true).
    // Best-effort mirror into Supabase so other parts of the app that read
    // candidates.isEmailVerified (profile visibility, admin views, etc.)
    // stay in sync. Login itself does NOT depend on this succeeding.
    if (pendingEmail) {
      try {
        await supabase.from("candidates").update({ isEmailVerified: true }).eq("email", pendingEmail);
      } catch (syncErr) {
        console.warn("Supabase verification sync failed (non-fatal):", syncErr);
      }
    }

    render("success", "Email Verified!", "Your email has been verified successfully. You can now log in to your account.", { showLogin: true });
    setTimeout(() => { window.location.href = "login.html"; }, 1800);
  } catch (err) {
    if (err && err.code === "auth/expired-action-code") {
      render("warning", "Link Expired", "This verification link has expired. Please request a new verification email from the login page.", { showLogin: true });
    } else if (err && err.code === "auth/invalid-action-code") {
      render("warning", "Already Verified", "This verification link has already been used. If you've already verified your email, you can log in now.", { showLogin: true });
    } else {
      render("error", "Verification Failed", (err && err.message) || "Something went wrong while verifying your email. Please try again or request a new link.", { showLogin: true });
    }
  }
});
</script>
</body>
</html>
